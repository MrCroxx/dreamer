[project]
name = "dreamer-cad"
version = "0.1.0"
description = "A local prompt-to-CAD and Bambu printing workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "cadquery>=2.6,<3", "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
src = ["backend"]
